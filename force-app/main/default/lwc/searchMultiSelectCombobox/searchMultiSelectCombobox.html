<template>
	<div class="slds-form-element">
		<label if:true={label} class="slds-form-element__label">
			<abbr if:true={required} title="required" class="slds-required">*</abbr>
			{label}</label
		>
		<div class="slds-form-element__control">
			<div class="slds-combobox_container">
				<div class={dropDownClass}>
					<div
						if:false={showInput}
						class="slds-combobox__form-element"
						role="none"
					>
						<button
							type="button"
							class="slds-input_faux slds-combobox__input slds-combobox__input-value"
							aria-labelledby="combobox-label-id-135 combobox-id-19-selected-value"
							id="combobox-id-19-selected-value"
							aria-controls="listbox-id-18"
							aria-expanded="false"
							aria-haspopup="listbox"
							onclick={handleInputClick}
						>
							<span class="slds-truncate" id="combobox-value-id-98">{selectedSearchLabel}</span>
						</button>
					</div>
					<div
						if:true={showInput}
						class="slds-combobox_form-element slds-input-has-icon slds-input-has-icon_right" role="none"
					>
						<input
							class="slds-input slds-combobox__input multi-select-combobox__input slds-has-focus"
							aria-controls="multi-pick-list-dropdown-items"
							role="combobox"
							placeholder={placeholder}
							type="text"
							value={searchterm}
							onkeyup={handlesearchterm}
							disabled={isDisabled}
							required={required}
						/>
						<span class="slds-icon_container">
							<lightning-icon
								icon-name="utility:search"
								class="slds-icon-utility-search slds-input__icon slds-input__icon_right slds-searchIcon"
								alternative-text="Approved"
								size="x-small"
							>
							</lightning-icon>
						</span>
					</div>
					<div
						class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid multi-select-combobox__listbox"
						role="listbox"
					>
						<ul class="slds-listbox slds-listbox_vertical" role="presentation">
							<template for:each={filterRecords} for:item="item">
								<c-multi-select-combobox-item key={item.value} item={item} onchange={handleChange}>
								</c-multi-select-combobox-item>
							</template>
						</ul>
					</div>
				</div>
			</div>
		</div>
		<div if:true={hasPillsEnabled}>
			<lightning-pill-container
				if:true={isVisible}
				items={selectedOptions}
				variant="bare"
				onitemremove={handleRemove}
			></lightning-pill-container>
		</div>
	</div>
</template>
