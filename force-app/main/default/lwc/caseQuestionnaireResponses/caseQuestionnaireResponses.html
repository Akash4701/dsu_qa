<template>
    <lightning-card title="Response Details" icon-name="custom:custom63">
        <!-- Check if questionnaire data exists -->
        <template if:true={selectedQuestionnaire}>
            <!-- Iterate over the questionnaire parameters and display their responses -->
            <template for:each={selectedQuestionnaire.Questionnaire_Parameters__r} for:item="parameter">
                <div key={parameter.Id} class="slds-box slds-box_x-small slds-m-bottom_medium">
                    <p><strong>{parameter.Question_Label__c}:</strong></p>
                    <!-- Iterate over the responses and display them -->
                    <template for:each={parameter.Questionnaire_Parameter_Responses__r} for:item="response">
                        <p key={response.Id}>
                            {response.Response__c} (Contact: {response.Respondent__r.Name})
                        </p>
                    </template>
                </div>
            </template>
        </template>
        <template if:false={selectedQuestionnaire}>
            <!-- If no data, show a message -->
            <div class="slds-text-align_center">
                <p>No response details available.</p>
            </div>
        </template>
    </lightning-card>
</template>
