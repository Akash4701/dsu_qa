<template>
    <lightning-card title="Program Intake Form" icon-name="standard:education">
        <div class="slds-var-p-around_medium">
            <!-- Loading Spinner -->
            <div if:true={showSpinner} class="slds-is-relative spinner-container">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>

            <!-- Configuration Display Banner -->
            <template if:true={isConfigurationLoaded}>
                <div class="slds-notify slds-notify_alert slds-alert_info slds-var-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">Info</span>
                    <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"
                        alternative-text="Info"></lightning-icon>
                    <h2>
                        <strong>Active Configuration:</strong> {configurationLabel}
                        <br />
                        <small>Mode: {masterRequirementMode} (Configuration-controlled)</small>
                    </h2>
                </div>
            </template>

            <!-- REMOVED: Manual Required Checkbox -->
            <!-- The checkbox is no longer needed as behavior is controlled by master configuration -->

            <!-- Error Message for Duplicate Program Plan -->
            <template if:true={isDuplicateFound}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"
                        alternative-text="Error"></lightning-icon>
                    <h2>
                        Program Plan "{formData.startingYear}-{formData.intake}-{formData.programAlias}" already exists.
                        Please use a different combination of Year, Intake, and Program.
                    </h2>
                    <div class="slds-notify__close">
                        <button class="slds-button slds-button_icon slds-button_icon-small" title="Close"
                            onclick={dismissDuplicateError}>
                            <lightning-icon icon-name="utility:close" size="small"
                                alternative-text="Close"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Academic Program & Program Alias -->
            <div class="slds-grid slds-gutters slds-wrap slds-var-m-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-combobox name="academicProgram" label="Academic Program"
                        placeholder="Select Academic Program" options={academicProgramOptions} onchange={handleChange}
                        required message-when-value-missing="Please select an Academic Program">
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-input type="text" name="programAlias" label="Program Alias" value={formData.programAlias}
                        readonly>
                    </lightning-input>
                </div>
            </div>

            <!-- Starting Year & Intake -->
            <div class="slds-grid slds-gutters slds-wrap slds-var-m-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-combobox name="starting year" label="Starting Year" placeholder="Select Starting Year"
                        options={startingYearOptions} onchange={handleChange} required
                        message-when-value-missing="Please select a Starting Year">
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-combobox name="intake" label="Intake" placeholder="Select Intake Month"
                        options={intakeOptions} onchange={handleChange} required
                        message-when-value-missing="Please select an Intake">
                    </lightning-combobox>
                </div>
            </div>

            <div class="slds-grid slds-gutters slds-wrap slds-var-m-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                   <lightning-combobox name="academicYear" label="Academic Year" placeholder="Select Academic Year"
                        options={academicYearOptions} onchange={handleChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-input type="date" name="maximumProgramDuration" label="Maximum Program Duration" 
                        value={formData.maximumProgramDuration} onchange={handleChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- Working Days & Intake Strength -->
            <div class="slds-grid slds-gutters slds-wrap slds-var-m-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-dual-listbox name="workingdays" label="Working Days" source-label="Available Days"
                        selected-label="Selected Days" options={workingDaysOptions} onchange={handleChange}
                        value={selectedWorkingDaysForPickList} required
                        message-when-value-missing="Please select Working Days">
                    </lightning-dual-listbox>
                    <!-- NEW: Show configuration-based hint -->
                    <template if:true={isStrictMode}>
                        <div class="slds-text-color_weak slds-var-m-top_x-small">
                            <lightning-icon icon-name="utility:info" size="xx-small"
                                class="slds-m-right_xx-small"></lightning-icon>
                            Configuration: Strict mode - Working days based on institutional standards
                        </div>
                    </template>
                    <template if:false={isStrictMode}>
                        <div class="slds-text-color_weak slds-var-m-top_x-small">
                            <lightning-icon icon-name="utility:info" size="xx-small"
                                class="slds-m-right_xx-small"></lightning-icon>
                            Configuration: Flexible mode - Working days can be customized
                        </div>
                    </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-input type="text" name="intakeStrength" label="Intake Number"
                        placeholder="Enter Intake Number" maxlength="5" onkeypress={handleNumberValidation}
                        onchange={handleTextChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- Start Date & End Date -->
            <div class="slds-grid slds-gutters slds-wrap slds-var-m-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-input type="date" name="startDate" label="Start Date" value={formData.startDate}
                        onchange={handleChange}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-input type="date" name="enddate" label="End Date" value={formData.endDate}>
                    </lightning-input>
                </div>
            </div>

            <!-- Total Duration & No of Terms -->
            <div class="slds-grid slds-gutters slds-wrap slds-var-m-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-input type="text" label="Total Duration (Weeks)" name="totalDuration"
                        value={formData.totalDuration} readonly>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-input type="text" label="No of Semester" name="noOfTerms" value={formData.noOfTerms}
                        readonly>
                    </lightning-input>
                </div>
            </div>

            <!-- Campus Format -->
            <div class="slds-grid slds-gutters slds-wrap slds-var-m-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_x-small">
                    <lightning-combobox name="campusFormat" label="Campus Format" placeholder="Select Campus Format"
                        options={campusFormatOptions} onchange={handleChange} required
                        message-when-value-missing="Please select a Campus Format">
                    </lightning-combobox>
                </div>
            </div>

            <div class="slds-var-m-top_medium">
                <hr class="slds-var-m-vertical_medium" />
            </div>

            <!-- Auto-generated Term Duration Fields (Strict Mode) -->
            <template if:true={isStrictMode}>
                <div class="slds-var-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-var-m-bottom_small">
                        <lightning-icon icon-name="utility:lock" size="small"
                            class="slds-m-right_x-small"></lightning-icon>
                        Term Configuration (Auto-calculated)
                    </h3>
                </div>
                <template for:each={termDurations} for:item="term" for:index="index">
                    <div key={term.id} class="slds-grid slds-gutters slds-wrap slds-var-m-bottom_medium">
                        <!-- Semester Duration (Auto-calculated) -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-p-around_x-small">
                            <lightning-input type="number" label={term.label} name={term.name} value={term.value}
                                onchange={handleChange} required readonly>
                            </lightning-input>
                        </div>
                        <!-- Start Date (Auto-calculated) -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-p-around_x-small">
                            <lightning-input type="date" label="Start Date" name={term.startDateName}
                                value={term.startDate} onchange={handleChange} required readonly>
                            </lightning-input>
                        </div>
                        <!-- End Date (Auto-calculated) -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-p-around_x-small">
                            <lightning-input type="date" label="End Date" name={term.endDateName} value={term.endDate}
                                onchange={handleChange} required readonly>
                            </lightning-input>
                        </div>
                    </div>
                </template>
            </template>

            <!-- Manual Term Duration Fields (Flexible Mode) -->
            <template for:each={termDurations} for:item="term" for:index="index">
                <div key={term.id} class="slds-grid slds-gutters slds-wrap slds-var-m-bottom_medium">
                    <!-- Semester Duration (Manual) -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-p-around_x-small">
                        <lightning-input type="number" label={term.label} name={term.name} placeholder="Enter weeks"
                            onchange={handleChange}>
                        </lightning-input>
                    </div>
                    <!-- Start Date (Manual) -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-p-around_x-small">
                        <lightning-input type="date" label="Start date" name={term.startDateName}
                            onchange={handleChange}>
                        </lightning-input>
                    </div>
                    <!-- End Date (Manual) -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-p-around_x-small">
                        <lightning-input type="date" label="End Date" name={term.endDateName} onchange={handleChange}>
                        </lightning-input>
                    </div>
                    <!-- Minimum Credit -->
                    <lightning-input type="number" label="Minimum Credit" name={term.minCreditName} 
    value={term.minCredit} onchange={handleTextChange} min="0">
</lightning-input>
                    <!-- Maximum Credit -->
                    <lightning-input type="number" label="Maximum Credit" name={term.maxCreditName} 
    value={term.maxCredit} onchange={handleTextChange} min="0">
</lightning-input>
                    <!-- Academic Term Combobox -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 slds-var-p-around_x-small">
                        <lightning-combobox name="academicTerm" label="Select Academic Term" value={term.academicTermId}
                            options={academicTermOptionss} onchange={handleAcademicTermChange} data-term-index={index}>
                        </lightning-combobox>
                    </div>
                    <!-- New Academic Term Button -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 slds-var-p-around_x-small"
                        style="margin-top: 25px;">
                        <lightning-button label="New Academic Term" variant="brand"
                            onclick={handleCreateAcademicTermClick} data-term-index={index}>
                        </lightning-button>
                    </div>
                </div>

            </template>

            <!-- Buttons: Save & Cancel -->
            <div class="slds-var-m-top_large slds-text-align_center">
                <lightning-button label="Cancel" variant="neutral" class="slds-var-m-right_small"
                    onclick={handleCancel}>
                </lightning-button>
                <lightning-button label="Save" variant="brand" onclick={handleSave} disabled={isSaveButtonDisabled}>
                </lightning-button>
            </div>
        </div>
        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Header -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={handleModalClose}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close"
                                size="small"></lightning-icon>
                        </button>
                        <h2 id="modal-heading-01" class="slds-text-heading_medium">Create Academic Term</h2>
                    </header>

                    <!-- Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <!-- Information Section -->
                        <div class="slds-section slds-is-open">
                            <h3 class="slds-section__title slds-theme_shaded slds-text-title_caps">Information</h3>
                            <div class="slds-section__content">
                                <!-- Two-Column Layout -->
                                <div class="slds-grid slds-gutters_medium">
                                    <!-- Column 1 -->
                                    <div class="slds-col slds-size_6-of-12">
                                        <!-- Academic Term Name -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <lightning-input name="Name" label="Academic Term Name*"
                                                value={newAcademicTerm.Name} onchange={handleInputChange}
                                                required></lightning-input>
                                        </div>

                                        <!-- Active Checkbox -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <lightning-input type="checkbox" name="IsActive__c" label="Active"
                                                checked={newAcademicTerm.IsActive__c}
                                                onchange={handleInputChange}></lightning-input>
                                        </div>

                                        <!-- Season Combobox -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <lightning-combobox name="Season__c" label="Season"
                                                value={newAcademicTerm.Season__c} options={seasonOptions}
                                                onchange={handleInputChange}></lightning-combobox>
                                        </div>

                                        <!-- Academic Year -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <lightning-input name="Academic_Year__c" label="Academic Year"
                                                value={newAcademicTerm.Academic_Year__c}
                                                onchange={handleInputChange}></lightning-input>
                                        </div>

                                        <!-- External Id -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <lightning-input name="External_Id__c" label="External Id"
                                                value={newAcademicTerm.External_Id__c}
                                                onchange={handleInputChange}></lightning-input>
                                        </div>

                                       
                                    </div>

                                    <!-- Column 2 -->
                                    <div class="slds-col slds-size_6-of-12">
                                        <!-- Owner -->
                                        <!-- <div class="slds-form-element slds-m-bottom_small">
                                    <label class="slds-form-element__label">Owner</label>
                                    <div class="slds-form-element__control">
                                        <div class="slds-form-element__static">
                                            <span class="slds-truncate">{ownerName}</span>
                                        </div>
                                    </div>
                                </div> -->

                                        <!-- Created Date -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <label class="slds-form-element__label">Created Date</label>
                                            <div class="slds-form-element__control">
                                                <div class="date-time-container">
                                                    <lightning-input type="date" name="Created_Date__c"
                                                        variant="label-hidden" value={newAcademicTerm.Created_Date__c}
                                                        onchange={handleInputChange}
                                                        class="date-input"></lightning-input>
                                                    <lightning-input type="time" name="Created_Time__c"
                                                        variant="label-hidden" value={newAcademicTerm.Created_Time__c}
                                                        onchange={handleInputChange}
                                                        class="time-input"></lightning-input>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Start Date -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <label class="slds-form-element__label">Start Date</label>
                                            <div class="slds-form-element__control">
                                                <div class="date-time-container">
                                                    <!-- Start Date -->
                                                    <lightning-input type="date" name="Start_Date__c"
                                                        variant="label-hidden" value={startDateOnly}
                                                        onchange={handleInputChange} class="date-input">
                                                    </lightning-input>
                                                    <lightning-input type="time" name="Start_Time__c"
                                                        variant="label-hidden" value={timeInputs.startTime}
                                                        onchange={handleInputChange} class="time-input">
                                                    </lightning-input>

                                                </div>
                                            </div>
                                        </div>

                                        <!-- End Date -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <label class="slds-form-element__label">End Date</label>
                                            <div class="slds-form-element__control">
                                                <div class="date-time-container">
                                                    <lightning-input type="date" name="End_Date__c"
                                                        variant="label-hidden" value={newAcademicTerm.End_Date__c}
                                                        onchange={handleInputChange}
                                                        class="date-input"></lightning-input>
                                                    <lightning-input type="time" name="End_Time__c"
                                                        variant="label-hidden" value={newAcademicTerm.End_Time__c}
                                                        onchange={handleInputChange}
                                                        class="time-input"></lightning-input>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Last Modified Date -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <label class="slds-form-element__label">Last Modified Date</label>
                                            <div class="slds-form-element__control">
                                                <div class="date-time-container">
                                                    <lightning-input type="date" name="Last_Modified_Date__c"
                                                        variant="label-hidden"
                                                        value={newAcademicTerm.Last_Modified_Date__c}
                                                        onchange={handleInputChange}
                                                        class="date-input"></lightning-input>
                                                    <lightning-input type="time" name="Last_Modified_Time__c"
                                                        variant="label-hidden"
                                                        value={newAcademicTerm.Last_Modified_Time__c}
                                                        onchange={handleInputChange}
                                                        class="time-input"></lightning-input>
                                                </div>
                                            </div>
                                        </div>

                                        

                                        <!-- Description -->
                                        <div class="slds-form-element slds-m-bottom_small">
                                            <lightning-textarea name="Description__c" label="Description"
                                                value={newAcademicTerm.Description__c}
                                                onchange={handleInputChange}></lightning-textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <footer class="slds-modal__footer">
                        <div class="button-container">
                            <lightning-button label="Cancel" onclick={handleModalClose}
                                class="cancel-button"></lightning-button>
                            <lightning-button label="Save" variant="brand" onclick={handleSaveAcademicTerm}
                                class="save-button"></lightning-button>
                        </div>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
