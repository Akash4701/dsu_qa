<template>
    <div class="donut" style={wrapperStyle} role="img" aria-label={ariaLabel}>
        <svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r={radius} fill="none" stroke-width="12"></circle>
            <circle class={ringClass} cx="60" cy="60" r={radius} fill="none" stroke-width="12" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray={dashArray} stroke-dashoffset={dashOffset}></circle>
        </svg>
        <div class="center">
            <span class="pct">{percent}<span class="sign">%</span></span>
            <span lwc:if={label} class="lbl">{label}</span>
            <span lwc:if={sublabel} class="sub">{sublabel}</span>
        </div>
    </div>
</template>
