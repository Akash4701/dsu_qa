<template>


    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class={_modalSize}>
        <div class="slds-modal__container">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
                <lightning-icon icon-name="utility:close" alternative-text="Cancel and close" variant="inverse"
                    onclick={closePopupHandler}></lightning-icon>
                <span class="slds-assistive-text">Cancel and close</span>
            </button>
            <div class="slds-modal__header slds-hide">
                <slot name="header" onslotchange={handleHeaderChange}></slot>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <slot></slot>
            </div>
            <div class="slds-modal__footer slds-hide">
                <slot name="footer" onslotchange={handleFooterChange}></slot>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

</template>
