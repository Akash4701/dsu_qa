<template>
    <lightning-card title="Registrar Signature" icon-name="standard:document">
        <lightning-spinner if:true={isBusy} variant="brand" alternative-text="Saving..."></lightning-spinner>

        <div class="slds-p-horizontal_medium">
            <p class="slds-text-color_weak slds-m-bottom_medium">
                This signature is printed above <b>Registrar</b> on every Student E-ID Card generated
                from now on. Existing cards keep their old signature until they are regenerated.
            </p>

            <template if:true={loadError}>
                <div class="slds-text-color_error slds-m-bottom_small">{loadError}</div>
            </template>

            <template if:true={info}>
                <!-- Current signature -->
                <div class="slds-text-title_caps slds-m-bottom_x-small">Current signature</div>
                <template if:true={info.hasSignature}>
                    <div class="signature-box">
                        <img src={info.dataUrl} alt="Registrar signature" class="signature-img"/>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        {info.fileName} · updated by {info.lastModifiedBy} on
                        <lightning-formatted-date-time value={info.lastModifiedDate} year="numeric"
                            month="short" day="2-digit" hour="2-digit" minute="2-digit">
                        </lightning-formatted-date-time>
                    </p>
                </template>
                <template if:false={info.hasSignature}>
                    <p class="slds-text-color_weak">
                        No Registrar signature uploaded. Cards are generated with a blank Registrar signature.
                    </p>
                </template>

                <template if:true={info.canManage}>
                    <!-- Upload -->
                    <div class="slds-m-top_large">
                        <lightning-input type="file" label={uploadLabel} accept=".png,.jpg,.jpeg"
                            onchange={handleFileChange}>
                        </lightning-input>
                        <p class="slds-text-body_small slds-text-color_weak">
                            PNG or JPG, up to {maxKb} KB. A wide image with a white or transparent
                            background prints best (it is shown at about 90 × 28 px on the card).
                        </p>
                    </div>

                    <template if:true={pending}>
                        <div class="slds-m-top_medium">
                            <div class="slds-text-title_caps slds-m-bottom_x-small">New signature preview</div>
                            <div class="signature-box">
                                <img src={pending.dataUrl} alt="New signature preview" class="signature-img"/>
                            </div>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">{pending.fileName}</p>
                        </div>
                    </template>

                    <div class="slds-m-top_medium">
                        <lightning-button variant="brand" label="Save Signature" onclick={handleSave}
                            disabled={isSaveDisabled}></lightning-button>
                        <lightning-button variant="neutral" label="Cancel" class="slds-m-left_x-small"
                            onclick={handleCancel} disabled={isCancelDisabled}></lightning-button>
                        <lightning-button variant="destructive-text" label="Remove Signature"
                            class="slds-m-left_x-small" onclick={handleRemove}
                            disabled={isRemoveDisabled}></lightning-button>
                    </div>
                </template>

                <template if:false={info.canManage}>
                    <div class="slds-text-color_weak slds-m-top_medium">
                        You can view the signature but not change it. Ask an admin for the
                        <b>ID Card Settings Admin</b> permission set.
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
