<template>
    <lightning-card title="Student Registration Window">
        <div class="slds-p-around_medium">
            <lightning-record-edit-form object-api-name="Student_Registration_Window__c"
                onsuccess={handleSuccess}
                onerror={handleError}
                onsubmit={handleSubmit}>

                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Left Side Column -->
                    <div class="slds-col slds-size_1-of-2">
                        <!-- Course Enrollment Management -->
                        <lightning-input-field field-name="Course_Enrollment_Management__c"
                            onchange={handleCourseEnrollmentChange} required>
                        </lightning-input-field> 

                        <!-- Status -->
                        <lightning-input-field field-name="Status__c" required>
                        </lightning-input-field>

                        <!-- Start Date -->
                        <lightning-input-field field-name="Start_Date__c" required>
                        </lightning-input-field>

                        <!-- End Date -->
                        <lightning-input-field field-name="End_Date__c" required>
                        </lightning-input-field>

                        <!-- Credits (Optional) -->
                        <lightning-input-field field-name="Credits__c">
                        </lightning-input-field>
                    </div>

                    <!-- Right Side Column -->
                    <div class="slds-col slds-size_1-of-2">
                        <!-- Academic Term -->
                        <lightning-input label="Academic Term" value={academicTermDisplayValue} variant="label-stacked"
                            disabled>
                        </lightning-input>

                        <!-- Program Plan -->
                        <lightning-input label="Program Plan" value={programPlanDisplayValue} variant="label-stacked"
                            disabled>
                        </lightning-input>

                        <!-- Active Checkbox -->
                        <lightning-input-field field-name="Active__c">
                        </lightning-input-field>
                    </div>
                </div>

                <!-- Footer Buttons -->
                <div class="slds-modal__footer slds-m-top_medium">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}>
                    </lightning-button>
                    <lightning-button variant="brand" label="Save" type="submit" class="slds-m-left_x-small">
                    </lightning-button>
                </div>

            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
