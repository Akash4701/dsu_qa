<template>
    <lightning-card title="New Pathway Enrollment Management">
        <div class="slds-p-around_medium">
            <lightning-record-edit-form object-api-name="Pathway_Enrollment__c"
                onsuccess={handleSuccess} onerror={handleError} onsubmit={handleSubmit}>

                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Left Column -->
                    <div class="slds-col slds-size_1-of-2">
                        <!-- Read-only display of Program Pathway name -->
                        <lightning-input label="Program Pathway" value={programPathwayName} disabled
                            variant="label-stacked">
                        </lightning-input>
                        
                    </div>

                    <!-- Right Column -->
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Academic_Term__c" ></lightning-input-field>
                        <lightning-input-field field-name="Start_Date__c" ></lightning-input-field>
                        <lightning-input-field field-name="End_Date__c" ></lightning-input-field>
                    </div>
                </div>

                <div class="slds-m-top_medium slds-text-align_right">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
                    <lightning-button variant="brand" label="Save" type="submit" class="slds-m-left_small">
                    </lightning-button>
                </div>

            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
