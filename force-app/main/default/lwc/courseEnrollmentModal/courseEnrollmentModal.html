<template>
    <lightning-card title="New Course Enrollment Management">
        <div class="slds-p-around_medium">
            <lightning-record-edit-form object-api-name="Course_Enrollment_Management__c"
                onsuccess={handleSuccess}
                onsubmit={handleSubmit}
                onerror={handleError}>

                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Left Column -->
                    <div class="slds-col slds-size_1-of-2">
                        <!-- Display Academic Term Name (disabled) -->
                        <lightning-input label="Academic Term"
                                         value={academicTermName}
                                         disabled
                                         variant="label-stacked">
                        </lightning-input>
                    </div>

                    <!-- Right Column -->
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Start_Date__c" ></lightning-input-field>
                        <lightning-input-field field-name="End_Date__c" ></lightning-input-field>
                        <lightning-input-field field-name="Is_Active__c"></lightning-input-field>
                    </div>
                </div>

                <!-- Hidden field for Academic Term -->
                <lightning-input-field field-name="Academic_Term__c"
                                       value={recordId}
                                       class="slds-hide">
                </lightning-input-field>

                <!-- Footer buttons -->
                <div class="slds-m-top_medium slds-text-align_right">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
                    <lightning-button variant="brand" type="submit" label="Save" class="slds-m-left_small"></lightning-button>
                </div>

            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
