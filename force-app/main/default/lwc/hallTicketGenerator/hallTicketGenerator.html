<!-- sldsValidatorIgnore -->
<template>
  <lightning-quick-action-panel header="Generate Hall Ticket" if:true={showAction}>
    <lightning-spinner if:true={isLoading} variant="brand" alternative-text="Loading..."></lightning-spinner>

    <div class="slds-grid slds-gutters">
      <lightning-input
        class="slds-col slds-size_1-of-3 slds-p-bottom_small"
        type="search"
        label="Search"
        placeholder="Search Student"
        onchange={handleSearch}>
      </lightning-input>
    </div>

    <lightning-datatable
      key-field="contactId"
      data={filteredStudents}
      columns={columns}
      onrowselection={handleRowSelection}
      selected-rows={filteredSelected}
      style="height: 310px"
      lwc:if={isInitialized}>
    </lightning-datatable>

    <div slot="footer">
      <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
      <lightning-button
        variant="brand"
        label="Generate"
        class="slds-m-left_x-small"
        onclick={handleGenerate}
        disabled={disableGenerate}>
      </lightning-button>
    </div>
  </lightning-quick-action-panel>
</template>
