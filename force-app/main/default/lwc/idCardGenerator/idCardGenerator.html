<template>
    <lightning-quick-action-panel header="Generate Student E-ID Card">
        <lightning-spinner if:true={isLoading} variant="brand" alternative-text="Generating..."></lightning-spinner>

        <div class="slds-p-around_small">
            <template if:true={info}>
                <p class="slds-m-bottom_x-small">
                    Generate the Student E-ID Card for
                    <b>{info.name}</b><template if:true={info.usn}> ({info.usn})</template>?
                </p>

                <template if:true={alreadyGenerated}>
                    <p class="slds-text-color_weak slds-m-bottom_x-small">
                        An ID card already exists for this student. Confirming will
                        <b>override</b> the existing card with a freshly generated one.
                    </p>
                </template>

                <template if:false={info.ready}>
                    <div class="slds-text-color_error slds-m-top_x-small">{info.message}</div>
                </template>
            </template>

            <template if:true={loadError}>
                <div class="slds-text-color_error">{loadError}</div>
            </template>
        </div>

        <div slot="footer">
            <lightning-button
                variant="neutral"
                label="Cancel"
                onclick={handleCancel}>
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Confirm &amp; Generate"
                class="slds-m-left_x-small"
                onclick={handleGenerate}
                disabled={isGenerateDisabled}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
